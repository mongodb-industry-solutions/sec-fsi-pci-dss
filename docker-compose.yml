# ── PSP Platform FSI PCI DSS Demo ───────────────────────────────────────────────
# Usage:
#   docker compose up --build          # build + start both services
#   docker compose up --build backend  # rebuild backend only
#   docker compose exec backend npm run setup:db  # provision QE collections
#   docker compose exec backend npm run seed       # seed demo data
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in MONGODB_URI, JWT_SECRET, KMS_PROVIDER.
#   2. For offline/local KMS: run `npm run setup:key` and set KMS_LOCAL_MASTER_KEY.
#   3. For QE shared library: set MONGODB_CRYPT_SHARED_LIB_PATH in .env.
#      The path must be accessible INSIDE the container — mount it via volumes if needed.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"  # host:container — Dockerfile sets PORT=8080; host exposes 8081
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PSP_SEED_DATA_DIR: /app/data
      PSP_CORS_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
      MONGODB_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PSP_URL_BACKEND: ${NEXT_PUBLIC_PSP_URL_BACKEND:-http://localhost:8081}
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy
