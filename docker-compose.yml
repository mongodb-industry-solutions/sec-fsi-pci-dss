# ── PSP Platform FSI PCI DSS Demo ───────────────────────────────────────────────
# Usage:
#   docker compose up --build                       # build + start both services
#   docker compose up --build backend               # rebuild backend only
#   docker compose exec backend npm run setup:db    # provision QE collections
#   docker compose exec backend npm run setup:seed  # seed demo data
#   docker compose exec backend npm run test:unit   # run unit tests in-container
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in MONGODB_URI, JWT_SECRET, KMS_PROVIDER.
#   2. For offline/local KMS: run `npm run setup:key:master` and set KMS_LOCAL_MASTER_KEY.
#   3. For OAuth/OIDC signing keys: run `npm run setup:key:rsa` (generates backend/keys/private.pem).
#      The backend/keys/ directory is mounted into the container via the volume below.
#      In production use PSP_OAUTH_KEY_PROVIDER=aws instead (no file needed).
#   4. For QE shared library: set MONGODB_CRYPT_SHARED_LIB_PATH in .env.
#      The path must be accessible INSIDE the container — mount it via volumes if needed.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8080"  # host:container — Dockerfile sets PORT=8080; host exposes 8081
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PSP_SEED_DATA_DIR: /app/backend/data
      PSP_PROJECT_ROOT: /app
      PSP_CORS_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
      MONGODB_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
      # Used by the merchant seeder to resolve the OIDC branding URLs (logo_uri/client_uri).
      PSP_MERCHANT_BASE_URL: ${PSP_MERCHANT_BASE_URL:-http://localhost:8082}
      # In-network bank host. Private by construction: no host port is published for bankcore.
      PSP_BANKCORE_BASE_URL: ${PSP_BANKCORE_BASE_URL:-http://bankcore:8080}
    depends_on:
      bankcore:
        condition: service_started
    volumes:
      - ./backend/keys:/app/backend/keys:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # bankcore: the Open Banking bank (ASPSP). PRIVATE service: the browser never calls it, the PSP
  # dispatches to it over the compose network. No host port is published on purpose.
  bankcore:
    build:
      context: .
      dockerfile: bankcore/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PSP_BANKCORE_SEED_DATA_DIR: /app/bankcore/data
      MONGODB_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
      PSP_BANKCORE_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
      # In-network PSP host, for the consent status callbacks bankcore delivers to its TPP.
      PSP_BASE_URL: ${PSP_BASE_URL:-http://backend:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PSP_URL_BACKEND_PUBLIC: ${NEXT_PUBLIC_PSP_URL_BACKEND_PUBLIC:-http://localhost:8081}
        # Private/in-network backend URL. Its presence (a) enables same-origin proxy mode (browser
        # fetches go through the Next.js rewrites server-side, matching staging/prod), and (b) powers
        # the Public/Private URL toggle on the merchant SSO OIDC endpoints panel. Default is the
        # compose-network service address, which is exactly the "private" URL an in-VPC integrator uses.
        NEXT_PUBLIC_PSP_URL_BACKEND_PRIVATE: ${NEXT_PUBLIC_PSP_URL_BACKEND_PRIVATE:-http://backend:8080}
        NEXT_PUBLIC_PSP_URL_MERCHANT: ${PSP_MERCHANT_BASE_URL:-http://localhost:8082}
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy

  # External merchant demo (Espresso Works). Autonomous Next.js app, NO database.
  # Integrates with the PSP purely via OAuth2/OIDC SSO + API. Container on 8080, host 8082.
  merchant:
    build:
      context: ./merchant
      dockerfile: Dockerfile
    ports:
      - "8082:8080"  # host:container — mirrors the frontend convention
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PSP_MERCHANT_PORT: 8080
      PSP_MERCHANT_BASE_URL: ${PSP_MERCHANT_BASE_URL:-http://localhost:8082}
      # Inside the compose network the PSP API is reachable as the backend service on 8080.
      PSP_MERCHANT_PSP_BASE_URL: ${PSP_MERCHANT_PSP_BASE_URL:-http://backend:8080}
      PSP_MERCHANT_AUTHORIZE_URL: ${PSP_MERCHANT_AUTHORIZE_URL:-http://localhost:8080/auth/authorize}
      PSP_MERCHANT_OAUTH_CLIENT_ID: ${PSP_MERCHANT_OAUTH_CLIENT_ID:-oauth001-0000-4000-8000-000000000001}
      PSP_MERCHANT_OAUTH_CLIENT_SECRET: ${PSP_MERCHANT_OAUTH_CLIENT_SECRET:-espresso-demo-secret-2026}
      PSP_MERCHANT_SESSION_SECRET: ${PSP_MERCHANT_SESSION_SECRET:-change-me-to-a-32-byte-random-secret-value}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
