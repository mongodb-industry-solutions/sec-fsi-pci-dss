# ── PSP Platform FSI PCI DSS Demo ───────────────────────────────────────────────
# Usage:
#   docker compose up --build                       # build + start both services
#   docker compose up --build backend               # rebuild backend only
#   docker compose exec backend npm run setup:db    # provision QE collections
#   docker compose exec backend npm run setup:seed  # seed demo data
#   docker compose exec backend npm run test:unit   # run unit tests in-container
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in MONGODB_URI, JWT_SECRET, KMS_PROVIDER.
#   2. For offline/local KMS: run `npm run setup:key:master` and set KMS_LOCAL_MASTER_KEY.
#   3. For OAuth/OIDC signing keys: run `npm run setup:key:rsa` (generates psp/backend/keys/private.pem).
#      The psp/backend/keys/ directory is mounted into the container via the volume below.
#      In production use PSP_OAUTH_KEY_PROVIDER=aws instead (no file needed).
#   4. For QE shared library: set MONGODB_CRYPT_SHARED_LIB_PATH in .env.
#      The path must be accessible INSIDE the container — mount it via volumes if needed.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: .
      dockerfile: psp/backend/Dockerfile
    ports:
      - "8081:8080"  # host:container — Dockerfile sets PORT=8080; host exposes 8081
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PSP_SEED_DATA_DIR: /app/psp/backend/data
      PSP_PROJECT_ROOT: /app
      PSP_CORS_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
      MONGODB_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
      # Used by the merchant seeder to resolve the OIDC branding URLs (logo_uri/client_uri).
      PSP_MERCHANT_BASE_URL: ${PSP_MERCHANT_BASE_URL:-http://localhost:8082}
      # In-network bank host. Private by construction: no host port is published for bankcore.
      PSP_BANKCORE_BASE_URL: ${PSP_BANKCORE_BASE_URL:-http://bankcore:8080}
      # The credential the PSP presents to the bank diagnostics surface: the bank issued it.
      PSP_BANKCORE_SECRET: ${PSP_BANKCORE_SECRET:-bankcore-local-secret-change-in-production}
    depends_on:
      bankcore:
        condition: service_started
    volumes:
      - ./psp/backend/keys:/app/psp/backend/keys:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # bankcore: the Open Banking bank (ASPSP). PRIVATE service: the browser never calls it, the PSP
  # dispatches to it over the compose network. No host port is published on purpose.
  bankcore:
    build:
      context: .
      dockerfile: bank/backend/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PSP_BANKCORE_SEED_DATA_DIR: /app/bank/backend/data
      MONGODB_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
      PSP_BANKCORE_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
      # The bank derives its TPP and diagnostics keys from its OWN root (v39 P4).
      PSP_BANKCORE_SECRET: ${PSP_BANKCORE_SECRET:-bankcore-local-secret-change-in-production}
      # In-network PSP host, for the consent status callbacks bankcore delivers to its TPP.
      PSP_BASE_URL: ${PSP_BASE_URL:-http://backend:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # GIAM: the identity and access authority. Every other service is a relying party or a resource
  # server against it. PUBLIC, and it has to be: a browser is redirected here to sign in, so a private
  # in-cluster host would work for a server-side call and be unreachable from the laptop doing the demo.
  # GIAM lives in its own repository (mongodb-industry-solutions/sec-giam). Set GIAM_REPO_PATH to a
  # local checkout of it; during the migration that checkout is at tmp/sec-giam.
  giam:
    build:
      context: ${GIAM_REPO_PATH:-../sec-giam}
      dockerfile: backend/Dockerfile
    ports:
      - "8085:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GIAM_SEED_DATA_DIR: /app/backend/data
      MONGODB_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
      GIAM_CRYPT_SHARED_LIB_PATH: /usr/local/lib/mongo_crypt_v1.so
      # In-network, for the services that resolve discovery server side.
      GIAM_BASE_URL: ${GIAM_BASE_URL:-http://giam:8080}
      # Browser facing, and what a realm issuer URL is built from: it ends up inside every token as
      # `iss`, so it must be the address a relying party can actually reach.
      GIAM_PUBLIC_URL: ${GIAM_PUBLIC_URL:-http://localhost:8085}
      GIAM_FRONTEND_URL: ${GIAM_FRONTEND_URL:-http://localhost:8086}
      GIAM_CORS_ORIGIN: ${GIAM_CORS_ORIGIN:-http://localhost:8086,http://localhost:8080,http://localhost:8082,http://localhost:8084}
    volumes:
      # This replica's own private key. Mounted rather than baked: a signing key in an image is a
      # signing key in a registry. With the default provider each replica holds its own, and the
      # published key set is what they share, so this volume is per replica and never shared.
      - ${GIAM_REPO_PATH:-../sec-giam}/backend/keys:/app/backend/keys
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The identity console: login, consent, registration, credentials, and the administration of realms,
  # providers, identities, roles, policies, clients, keys, sessions and audit.
  # Also from the sec-giam repository: GIAM_REPO_PATH points at a local checkout of it, which during
  # the migration is tmp/sec-giam.
  giam-frontend:
    build:
      context: ${GIAM_REPO_PATH:-../sec-giam}
      dockerfile: frontend/Dockerfile
    ports:
      # The plan reserves 8084 for this app, but bank-frontend already publishes there, so the console
      # takes 8086 and the collision is recorded rather than silently resolved.
      - "8086:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Server side only: the console proxies the API same-origin, so the browser never learns this
      # address and no CORS entry is needed for the console to work.
      GIAM_API_PRIVATE_URL: ${GIAM_BASE_URL:-http://giam:8080}
    depends_on:
      giam:
        condition: service_healthy

  # The bank's own administration app. A separate institution gets a separate app: it talks to the bank's
  # API over the compose network and needs no PSP anything.
  bank-frontend:
    build:
      context: ./bank/frontend
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Server side only: this app calls the bank from its own route handlers, so the address never reaches
      # the browser and the private in-network one is the right one to use.
      PSP_BANKCORE_BASE_URL: ${PSP_BANKCORE_BASE_URL:-http://bankcore:8080}
      # v39 P4: the BANK's own root, never the platform secret. This app administers a separate
      # institution and presents a credential that institution issued; passing the platform secret
      # here is what made the boundary between them documentation rather than key material.
      PSP_BANKCORE_SECRET: ${PSP_BANKCORE_SECRET:-bankcore-local-secret-change-in-production}
    depends_on:
      bankcore:
        condition: service_healthy

  frontend:
    build:
      context: ./psp/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PSP_URL_BACKEND_PUBLIC: ${NEXT_PUBLIC_PSP_URL_BACKEND_PUBLIC:-http://localhost:8081}
        # Private/in-network backend URL. Its presence (a) enables same-origin proxy mode (browser
        # fetches go through the Next.js rewrites server-side, matching staging/prod), and (b) powers
        # the Public/Private URL toggle on the merchant SSO OIDC endpoints panel. Default is the
        # compose-network service address, which is exactly the "private" URL an in-VPC integrator uses.
        NEXT_PUBLIC_PSP_URL_BACKEND_PRIVATE: ${NEXT_PUBLIC_PSP_URL_BACKEND_PRIVATE:-http://backend:8080}
        NEXT_PUBLIC_PSP_URL_MERCHANT: ${PSP_MERCHANT_BASE_URL:-http://localhost:8082}
        # Private only for the API: the admin monitoring page probes bankcore through the Next.js proxy, so
        # the browser never leaves the frontend origin and the bank's API needs no published port.
        NEXT_PUBLIC_PSP_URL_BANKCORE_PRIVATE: ${PSP_BANKCORE_BASE_URL:-http://bankcore:8080}
        # PUBLIC, and it has to be: the simulator LINKS to the bank's own app, so a browser navigates there.
        # A private in-cluster host would work for a server-side probe and be unreachable from a laptop.
        NEXT_PUBLIC_PSP_URL_BANKCORE_FRONTEND_PUBLIC: ${PSP_BANKCORE_FRONTEND_PUBLIC_URL:-http://localhost:8084}
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy
      bankcore:
        condition: service_started

  # External merchant demo (Espresso Works). Autonomous Next.js app, NO database.
  # Integrates with the PSP purely via OAuth2/OIDC SSO + API. Container on 8080, host 8082.
  merchant:
    build:
      context: ./merchant
      dockerfile: Dockerfile
    ports:
      - "8082:8080"  # host:container — mirrors the frontend convention
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PSP_MERCHANT_PORT: 8080
      PSP_MERCHANT_BASE_URL: ${PSP_MERCHANT_BASE_URL:-http://localhost:8082}
      # Inside the compose network the business API is reachable as the backend service on 8080.
      PSP_MERCHANT_PSP_BASE_URL: ${PSP_MERCHANT_PSP_BASE_URL:-http://backend:8080}
      # Discovery, token and introspection now come from the authority, not the business API.
      PSP_MERCHANT_ISSUER_URL: ${PSP_MERCHANT_ISSUER_URL:-http://giam:8080/realms/leafypay}
      # Sign-in is a BROWSER navigation, so it is the authority's PUBLIC console, not its service name.
      PSP_MERCHANT_AUTHORIZE_URL: ${PSP_MERCHANT_AUTHORIZE_URL:-http://localhost:8086/auth/login}
      # These five links are LeafyPay's own pages, so they follow the application front end. They used
      # to be derived from the authorize URL, which would now send four of them to the authority.
      PSP_MERCHANT_APP_FRONTEND_URL: ${PSP_MERCHANT_APP_FRONTEND_URL:-http://localhost:8080}
      PSP_MERCHANT_LOGOUT_URL: ${PSP_MERCHANT_LOGOUT_URL:-http://localhost:8080/auth/logout}
      PSP_MERCHANT_PORTAL_URL: ${PSP_MERCHANT_PORTAL_URL:-http://localhost:8080}
      PSP_MERCHANT_DASHBOARD_URL: ${PSP_MERCHANT_DASHBOARD_URL:-http://localhost:8080/system}
      PSP_MERCHANT_SIMULATOR_URL: ${PSP_MERCHANT_SIMULATOR_URL:-http://localhost:8080/simulator}
      PSP_MERCHANT_CREDENTIALS_URL: ${PSP_MERCHANT_CREDENTIALS_URL:-http://localhost:8080/system/profile/credentials}
      PSP_MERCHANT_OAUTH_CLIENT_ID: ${PSP_MERCHANT_OAUTH_CLIENT_ID:-oauth001-0000-4000-8000-000000000001}
      # No default. The authority derives this client's secret from its id when the variable is unset,
      # and a literal here would be a second opinion about the same value: set it in .env, or leave it
      # unset on both sides and let the derivation agree with itself.
      PSP_MERCHANT_OAUTH_CLIENT_SECRET: ${PSP_MERCHANT_OAUTH_CLIENT_SECRET:-}
      PSP_MERCHANT_SESSION_SECRET: ${PSP_MERCHANT_SESSION_SECRET:-change-me-to-a-32-byte-random-secret-value}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
