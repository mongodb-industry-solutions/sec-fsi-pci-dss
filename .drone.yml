        - ingress.enabled=true
        - ingress.hosts[0]=sec-fsi-pci-dss-backend.industrysolutions.prod.corp.mongodb.com
        # Public backend API ingress (no corp Okta SSO) — see staging deploy note. Verify the flag
        # name against the Kanopy web-app chart 4.25.0 before relying on it in production.
        - ingress.authenticated=false
        - mesh.enabled=true
      wait: true
      timeout: 300s
      api_server: https://api.prod.corp.mongodb.com
      kubernetes_token:
        from_secret: prod_kubernetes_token
      values_files:
