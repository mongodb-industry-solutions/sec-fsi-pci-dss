---
kind: pipeline
type: kubernetes
name: staging

trigger:
  branch:
    - staging
  event:
    - push

steps:
  # Gate: run the headless test suites (unit + integration) before building/deploying. Uses test:ci
  # (NOT test) — e2e needs a browser + a running frontend, which this runner does not provide.
  - name: test
    image: node:22
    commands:
      - npm install --no-audit --no-fund
      - (cd backend && npm install --no-audit --no-fund)
      - (cd frontend && npm install --no-audit --no-fund)
      - npm run test:ci

  - name: publish-backend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/sec-fsi-pci-dss-backend
      dockerfile: backend/Dockerfile
      context: .
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key

  - name: publish-frontend
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/sec-fsi-pci-dss-frontend
      dockerfile: frontend/Dockerfile
      context: frontend/
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      build_args:
        - NEXT_PUBLIC_PSP_URL_BACKEND_PUBLIC=https://sec-fsi-pci-dss-backend.industrysolutions.staging.corp.mongodb.com
        - NEXT_PUBLIC_PSP_URL_BACKEND_PRIVATE=http://sec-fsi-pci-dss-backend-web-app:80
        - NEXT_PUBLIC_PSP_URL_MERCHANT=https://sec-fsi-pci-dss-merchant.industrysolutions.staging.corp.mongodb.com
        - NEXT_PUBLIC_PSP_URL_MERCHANT_PRIVATE=http://sec-fsi-pci-dss-merchant-web-app:80
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key

  - name: publish-merchant
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/sec-fsi-pci-dss-merchant
      dockerfile: merchant/Dockerfile
      context: merchant/
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key

  - name: deploy-backend-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.25.0
      add_repos:
        - mongodb=https://10gen.github.io/helm-charts
      namespace: industrysolutions
      release: sec-fsi-pci-dss-backend
      values:
        - image.tag=git-${DRONE_COMMIT_SHA:0:7}
        - image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/sec-fsi-pci-dss-backend
        - ingress.enabled=true
        - ingress.hosts[0]=sec-fsi-pci-dss-backend.industrysolutions.staging.corp.mongodb.com
        - mesh.enabled=true
      wait: true
      timeout: 300s
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
      values_files:
        - environments/staging.yaml

  - name: deploy-frontend-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.25.0
      add_repos:
        - mongodb=https://10gen.github.io/helm-charts
      namespace: industrysolutions
      release: sec-fsi-pci-dss-frontend
      values:
        - image.tag=git-${DRONE_COMMIT_SHA:0:7}
        - image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/sec-fsi-pci-dss-frontend
        - ingress.enabled=true
        - ingress.hosts[0]=sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com
        - mesh.enabled=true
      wait: true
      timeout: 300s
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
      values_files:
        - environments/staging.yaml

  - name: deploy-merchant-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.25.0
      add_repos:
        - mongodb=https://10gen.github.io/helm-charts
      namespace: industrysolutions
      release: sec-fsi-pci-dss-merchant
      values:
        - image.tag=git-${DRONE_COMMIT_SHA:0:7}
        - image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/sec-fsi-pci-dss-merchant
        - ingress.enabled=true
        - ingress.hosts[0]=sec-fsi-pci-dss-merchant.industrysolutions.staging.corp.mongodb.com
        - mesh.enabled=true
      wait: true
      timeout: 300s
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
      values_files:
        - environments/staging.yaml

