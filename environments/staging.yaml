env:
  NODE_ENV: staging
  PSP_KMS_PROVIDER: local
  # This deployment uses the LOCAL OAuth signing provider (no real AWS KMS key wired here). The local
  # provider auto-generates an RSA signing key on first boot in non-production. Switch to `aws` only
  # with @aws-sdk/client-kms available (now a backend dep) + a REAL PSP_OAUTH_AWS_KEY_ARN + IRSA.
  PSP_OAUTH_KEY_PROVIDER: local
  PSP_CORS_ORIGIN: "*"
  # PSP_CORS_ORIGIN: "https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com"
  PSP_URL_FRONTEND: "https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com"
  # Backend OIDC issuer + endpoints (discovery/token/jwks/userinfo) AND internal self-dispatch. Must be
  # a URL reachable BOTH by the backend itself and by the merchant pod → the in-cluster service (same
  # private path the frontend uses). It becomes the id_token `iss`; the merchant verifies against the
  # discovery doc, so it only needs to be self-consistent, not public.
  PSP_BASE_URL: "http://sec-fsi-pci-dss-backend-web-app:80"

  # ── Merchant app (Espresso Works) config ──────────────────────────────────────────────────────
  # Browser-facing sign-in → the PUBLIC GIAM console. Credential entry lives at the authority.
  PSP_MERCHANT_AUTHORIZE_URL: "https://sec-giam-console.industrysolutions.staging.corp.mongodb.com/auth/login"
  # Server-to-server discovery, token and introspection → PRIVATE in-cluster GIAM service.
  PSP_MERCHANT_ISSUER_URL: "http://sec-giam-web-app:80/realms/leafypay"
  # Server-to-server BUSINESS API → PRIVATE in-cluster backend service. Unchanged: no business
  # endpoint moved, and this variable is the proof that authentication was separable from them.
  PSP_MERCHANT_PSP_BASE_URL: "http://sec-fsi-pci-dss-backend-web-app:80"
  # LeafyPay's own browser-facing pages. Set EXPLICITLY: they used to be derived from the authorize
  # URL by string replacement, so moving that URL to the authority would have silently taken the
  # portal, the dashboard, the simulator and the credentials page with it, to a host that serves none.
  PSP_MERCHANT_APP_FRONTEND_URL: "https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com"
  PSP_MERCHANT_LOGOUT_URL: "https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com/auth/logout"
  PSP_MERCHANT_PORTAL_URL: "https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com"
  PSP_MERCHANT_DASHBOARD_URL: "https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com/system"
  PSP_MERCHANT_SIMULATOR_URL: "https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com/simulator"
  PSP_MERCHANT_CREDENTIALS_URL: "https://sec-fsi-pci-dss-frontend.industrysolutions.staging.corp.mongodb.com/system/profile/credentials"
  # This app's own public URL (redirect_uri host + seeder branding).
  PSP_MERCHANT_BASE_URL: "https://sec-fsi-pci-dss-merchant.industrysolutions.staging.corp.mongodb.com"
  # Browser-facing Swagger UI (/help link) → PUBLIC backend URL (the API base above is in-cluster only).
  PSP_MERCHANT_SWAGGER_URL: "https://sec-fsi-pci-dss-backend.industrysolutions.staging.corp.mongodb.com/doc"

  # ── bankcore, the Open Banking bank (ASPSP), v37 ───────────────────────────────────────────────
  # Kill switch. Deliberately still FALSE here while the local default is true: these environments are not
  # updated until v37 is functional and P11 has verified it, so they keep the built-in engines until then.
  # Flipping this is a deployment decision, not a code one.
  PSP_BANKCORE_ENABLED: "false"
  # PRIVATE in-cluster service. bankcore has NO public ingress: the browser calls the PSP, which
  # dispatches. Giving it a public hostname would create exactly the surface this design avoids.
  PSP_BANKCORE_BASE_URL: "http://sec-fsi-pci-dss-bankcore-web-app:80"
  # PUBLIC bankcore host, browser facing: Swagger UI for reviewing and exercising the bank's Open
  # Banking API. Operating on it requires a registered TPP's credentials, so the docs being public
  # opens nothing. Server to server traffic keeps using the in-cluster URL above.
  PSP_BANKCORE_PUBLIC_URL: "https://sec-fsi-pci-dss-bankcore.industrysolutions.staging.corp.mongodb.com"
  PSP_BANKCORE_SWAGGER_URL: "https://sec-fsi-pci-dss-bankcore.industrysolutions.staging.corp.mongodb.com/doc"
  # The bank's callback to the PSP resolves from PSP_BASE_URL above (in-cluster), so no new variable.
  # PSD2 consent landing state: automatic keeps the demo unblocked, manual needs an operator.
  PSP_BANKCORE_CONSENT_MODE: automatic
  # TPP client id. The matching secret is in envSecrets: both are read at SEED time only, one to write
  # the bank's bcrypt verifier and one to write the PSP's provider credential.
  PSP_BANKCORE_TPP_CLIENT_ID: leafypay-psp

  # ── GIAM, the identity and access authority ────────────────────────────────────────────
  # GIAM is deployed from its own repository (sec-giam), which owns its pod configuration: its
  # public and console URLs, its CORS allowlist, its key provider, its database and its key vault.
  # This file sets only what THIS platform reads in order to reach it. Declaring GIAM's own values
  # here too is how the two files drift, and the drift surfaces as a login or CORS failure that
  # reads like an application bug.
  #
  # PRIVATE in-cluster service: discovery, token, introspection and JWKS, all called server side.
  # Also the bare host the shared link resolver builds absolute endpoints on, so it carries NO realm.
  GIAM_BASE_URL: "http://sec-giam-web-app:80"
  # The platform realm issuer, private for the same reason. PSP_-prefixed deliberately: the shared
  # link resolver reads the UNPREFIXED name as a bare host, and a realm URL there would be joined
  # onto fixture paths that already carry their own realm, producing /realms/x/realms/y.
  PSP_GIAM_ISSUER_URL: "http://sec-giam-web-app:80/realms/leafypay"
  # What a token must name in its audience claim to be accepted here, and the name this platform
  # registers its enforcement points under. Both are the realm GIAM seeds for this platform.
  GIAM_AUDIENCE: "leafypay"
  GIAM_RESOURCE_SERVER: "leafypay"
  # This service's OWN client at GIAM, for the calls it makes as itself rather than for a person.
  # Registered in GIAM's client fixtures; the matching secret is in envSecrets.
  GIAM_CLIENT_ID: "leafypay-backend"
  # How long a fetched key set is reused before it is refreshed. A stale copy is safe: an old public
  # key can only verify signatures GIAM itself produced.
  GIAM_JWKS_CACHE_SECONDS: "900"
  # The bank is a relying party in its OWN realm. A platform token carries a different issuer and is
  # refused before any claim is read, which is what makes the institutional boundary structural.
  PSP_BANKCORE_GIAM_ISSUER_URL: "http://sec-giam-web-app:80/realms/bankcore"
  PSP_BANKCORE_GIAM_AUDIENCE: "bankcore"
  PSP_BANKCORE_GIAM_RESOURCE_SERVER: "bankcore"
  PSP_BANKCORE_GIAM_JWKS_CACHE_SECONDS: "900"

envSecrets:
  MONGODB_URI: sec-fsi-pci-dss-secrets-staging
  # Merchant OAuth client id/secret + session cookie key — populate these keys in the
  # sec-fsi-pci-dss-secrets-staging secret (values never live in this file).
  PSP_MERCHANT_OAUTH_CLIENT_ID: sec-fsi-pci-dss-secrets-staging
  PSP_MERCHANT_OAUTH_CLIENT_SECRET: sec-fsi-pci-dss-secrets-staging
  PSP_MERCHANT_SESSION_SECRET: sec-fsi-pci-dss-secrets-staging
  MONGODB_DB_NAME: sec-fsi-pci-dss-secrets-staging
  # Bank database, separate from the PSP one on the same cluster.
  PSP_BANKCORE_DB_NAME: sec-fsi-pci-dss-secrets-staging
  # TPP client secret and the bank's token signing key. Never inline in this file.
  PSP_BANKCORE_TPP_CLIENT_SECRET: sec-fsi-pci-dss-secrets-staging
  PSP_BANKCORE_ACCESS_TOKEN_SECRET: sec-fsi-pci-dss-secrets-staging
  PSP_KMS_LOCAL_MASTER_KEY: sec-fsi-pci-dss-secrets-staging
  PSP_KMS_KEY_VAULT_DATABASE: sec-fsi-pci-dss-secrets-staging
  PSP_KMS_KEY_VAULT_COLLECTION: sec-fsi-pci-dss-secrets-staging
  PSP_ADM_USER: sec-fsi-pci-dss-secrets-staging
  PSP_ADM_PASS: sec-fsi-pci-dss-secrets-staging
  PSP_OAUTH_AWS_KEY_ARN: sec-fsi-pci-dss-secrets-staging
  # This platform's own client secret at GIAM, presented for the client_credentials calls it makes
  # as itself. GIAM derives it per client id, so the two sides must agree on one value.
  GIAM_CLIENT_SECRET: sec-fsi-pci-dss-secrets-staging
  # Presented when registering this platform's enforcement points at GIAM's administration API. The
  # same value GIAM holds as its admin token: the bank falls back to GIAM_ADMIN_TOKEN, the platform
  # has no fallback and needs it under its own name.
  GIAM_REGISTRATION_TOKEN: sec-fsi-pci-dss-secrets-staging
  # The credential the bank presents to GIAM's administration API. Ours to hold, GIAM's to issue.
  GIAM_ADMIN_TOKEN: sec-fsi-pci-dss-secrets-staging

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

serviceAccount:
  enabled: true
  create: false
  name: irsa-industrysolutions-staging
